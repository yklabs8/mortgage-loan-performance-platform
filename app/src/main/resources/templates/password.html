<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{password.title})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <h1 th:text="#{password.title}">Change Password</h1>
  <div th:replace="~{fragments :: flash}"></div>
  <section class="card narrow">
    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post" class="stack">
      <label><span th:text="#{password.old}">Current password</span> <input type="password" th:field="*{oldPassword}" autocomplete="current-password" required></label>
      <p class="field-err" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}">Error</p>
      <label><span th:text="#{password.new}">New password</span> <input type="password" th:field="*{newPassword}" autocomplete="new-password" required></label>
      <p class="field-err" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Error</p>
      <label><span th:text="#{password.confirm}">Confirm new password</span> <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required></label>
      <p class="field-err" th:if="${#fields.hasErrors('confirmed')}" th:errors="*{confirmed}">Error</p>
      <button type="submit" th:text="#{password.submit}">Change</button>
    </form>
    <p class="muted" th:text="#{password.hint}">New password: 12–64 characters with at least one letter and one digit. Five wrong current passwords in a row lock the account for 15 minutes.</p>
  </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
